    <meta name="keywords" content="부자생각, Booza Think, 의사결정, 주식, 부동산, 정치, AI 분석" />
    <meta property="og:title" content="Booza Think | 의사결정 인텔리전스 플랫폼" />
    <meta property="og:description" content="Booza Think(부자생각)는 데이터 기반의 주식, 부동산, 정치 분석을 제공하는 종합 의사결정 인텔리전스 플랫폼입니다." />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      // 기존 서비스 워커 강제 해제 및 캐시 무효화 자가 치유 스크립트
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          if (registrations.length > 0) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().then(function(success) {
                if (success) {
                  console.log('[PWA] Service Worker unregistered.');
                  window.location.reload();
                }
              });
            }
          }
        });
      }
    </script>

  <body class="h-full font-sans bg-slate-950 text-slate-100">
